name: Windows binary release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-binary:
    runs-on: windows-latest

    name: windows (${{ matrix.r-version }})

    strategy:
      fail-fast: false
      matrix:
        r-version:
          - oldrel-1
          - release
          - devel

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          windows-path-include-rtools: true
          windows-path-include-mingw: true

      - name: Standardize R version
        shell: Rscript {0}
        run: |
          rver <- paste(R.version$major, strsplit(R.version$minor, ".", fixed = TRUE)[[1]][1], sep = ".")
          label <- "${{ matrix.r-version }}"
          # ITKR-<setup-r version>.zip (e.g. ITKR-release.zip, ITKR-oldrel-1.zip) is the
          # stable name ANTsR/ANTsRCore CI fetch from releases/latest/download/;
          # ITKR-<rver>.zip keeps the older per-R-version name working
          writeLines(c(
            sprintf("PACKAGE_ASSET=ITKR-%s-R%s.zip", label, rver),
            sprintf("PACKAGE_ALIAS=ITKR-%s.zip", label),
            sprintf("PACKAGE_RVER=ITKR-%s.zip", rver)
          ), Sys.getenv("GITHUB_ENV"))

      - name: Install package dependencies
        shell: Rscript {0}
        run: |
          install.packages("Rcpp", repos = "https://cloud.r-project.org")

      - name: Build Windows binary
        shell: cmd
        run: |
          R CMD INSTALL --build .
          for /f "delims=" %%i in ('dir /b /s ITKR_*.zip') do set ZIPFILE=%%i
          if not defined ZIPFILE (
            echo ITKR binary zip was not produced.
            exit /b 1
          )
          copy /y "%ZIPFILE%" "%PACKAGE_ASSET%"
          copy /y "%ZIPFILE%" "%PACKAGE_ALIAS%"
          copy /y "%ZIPFILE%" "%PACKAGE_RVER%"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ASSET }}
          path: |
            ${{ env.PACKAGE_ASSET }}
            ${{ env.PACKAGE_ALIAS }}
            ${{ env.PACKAGE_RVER }}

  publish:
    needs: windows-binary
    # publish whatever built, so a devel failure doesn't block oldrel/release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: ITKR-*.zip
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # downstream CI downloads from releases/latest/download/
          make_latest: true
          files: assets/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
